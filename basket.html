    <meta charset="UTF-8">

    <link rel="stylesheet" href="Assets/css_files/basket.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Birthstone&family=Playwrite+IT+Moderna&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- starting of the header codes -->
    <header>
        <nav>
            <div class="header_elements">
                <a href="index.html">
                    <h2 class="logo">WarmSIP</h2>
                </a>
                <div class="header_rightSide">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="menu.html">Menu</a></li>
                        <li><a href="services.html">Services</a></li>
                        <li><a href="contact_us.html">Contact Us</a></li>
                    </ul>
                    <a href="basket.html"><img src="Assets/images/emptyBasket.png" width="75" alt="basket_icon"
                            class="basket_icon"></a>
                </div>
            </div>
        </nav>
    </header>
    <!-- ending of the header codes -->

    <!-- starting of main codes -->
    <main>

        <!-- starting of the title and items part (Jana) -->
        <h1>Your Basket</h1>

        <section class="cards">
            <!--starting of first product card -->
            <article class="card_content">
                <div class="infos"> <!--product info-->
                    <div class="photo"> <!--product photo-->
                        <img src="Assets/images/Iced_Mocha.jpg" alt="Ice Mocka photo" width="150">
                    </div>
                    <div class="text_info"> <!--title and price-->
                        <h3>Ice Mocka</h3>
                        <p class="price">50</p>
                    </div>
                </div>
                <div class="quantity_control"> <!--quantity control-->
                    <div class="quantity">
                        <img class="icon" src="Assets/images/thick_minus.png"
                            alt="minus sign to reduce product quantity by one" width="30" height="30">
                        <p>2</p>
                        <img class="icon" src="Assets/images/plus.png"
                            alt="plus sign to increase product quantity by one" width="20" height="20">
                    </div>
                    <div class="garbige">
                        <img class="icon" src="Assets/images/garbige.png" alt="garbige icon for removing the item"
                            width="40">
                    </div>
                </div>
            </article>
            <!--ending of first product card -->

            <!--starting of second product card -->
            <article class="card_content">
                <div class="infos"> <!--product info-->
                    <div class="photo"> <!--product photo-->
                        <img src="Assets/images/Waffles.jpg" alt="Waffles photo" width="150">
                    </div>


                    <div class="text_info"> <!--title and price-->
                        <h3>Waffles</h3>
                        <p class="price">25</p>
                    </div>
                </div>
                <div class="quantity_control"> <!--quantity control-->
                    <div class="quantity">
                        <img class="icon" src="Assets/images/thick_minus.png"
                            alt="minus sign to reduce product quantity by one" width="30" height="30">
                        <p>1</p>
                        <img class="icon" src="Assets/images/plus.png"
                            alt="plus sign to increase product quantity by one" width="20" height="20">
                    </div>
                    <div class="garbige">
                        <img class="icon" src="Assets/images/garbige.png" alt="garbige icon for removing the item"
                            width="40">
                    </div>
                </div>
            </article>
            <!--ending of second product card -->

            <!--starting of third product card -->
            <article class="card_content">
                <div class="infos"> <!--product info-->
                    <div class="photo"> <!--product photo-->
                        <img src="Assets/images/Hot_Chocolate.jpg" alt="Hot Chocolate photo" width="150">
                    </div>
                    <div class="text_info"> <!--title and price-->
                        <h3>Hot Chocolate</h3>
                        <p class="price">22</p>
                    </div>
                </div>
                <div class="quantity_control"> <!--quantity control-->
                    <div class="quantity">
                        <img class="icon" src="Assets/images/thick_minus.png"
                            alt="minus sign to reduce product quantity by one" width="30" height="30">
                        <p>1</p>
                        <img class="icon" src="Assets/images/plus.png"
                            alt="plus sign to increase product quantity by one" width="20" height="20">
                    </div>
                    <div class="garbige">
                        <img class="icon" src="Assets/images/garbige.png" alt="garbige icon for removing the item"
                            width="40">
                    </div>
                </div>
            </article>
            <!--ending of third product card -->

        </section>

        <!-- ending of the title and items part (Jana) -->



        <!-- starting of the drop list (Zahrah) -->
<section class="basket_section">

    <div class="branch_box">
        <label for="branch">Choose a branch:</label>

        <select id="branch" name="branch">
            <option value="">Select a branch</option>
            <option value="Dhahran">Prince Mutaib Road, Hajer District, Dhahran 34254, Saudi Arabia.</option>
            <option value="Al Khobar">King Saud bin Abdulaziz Road, Al-Safa District, Al Khobar 34222, Saudi Arabia.</option>
            <option value="dammam">Abu Bakr Al-Siddiq Street, Al-Manar District, Dammam 32274, Saudi Arabia.</option>
        </select>
    </div>

</section>
        <!-- ending of the drop list (Zahrah) -->



        <!-- reservation info, date, time and comments (Roba) -->
<section class="reservation_info">
  <div class="reservation_box">
    <h2 class="reservation_title">Reservation Info</h2>

    <h3 class="time_label">Select Time</h3>
    <div class="input_group">
      <input type="time" id="reservation_time" name="reservation_time" required>
    </div>

    <h3 class="date_label">Select Date</h3>
    <div class="input_group">
      <input type="date" id="reservation_date" name="reservation_date" required min="2026-03-30">
    </div>

    <h3 class="comments_label">Comments</h3>
    <div class="input_group">
      <textarea id="reservation_comments" name="reservation_comments" placeholder="Write your comments here..."></textarea>
    </div>

  </div>
</section>
        <!-- reservation info, date, time and comments (Roba) -->



        <!-- starting of payment infos and total price (Maria) -->

        <!-- ending of payment infos and total price (Maria) -->



        <!-- starting pay button (Zahrah) -->
        <button class="checkout_btn">Puy Now </button> 
        <!-- ending pay button (Zahrah) -->

    </main>
    <!-- ending of main codes -->

        <div class="row_one">س
            <a href="">Locations</a>

                </li>
                <li><a href="" target="_blank" class="instagramIcon"><img src="Assets/images/emailIcon.png"
                            alt="Email Icon" width="50" class="inst"></a></li>
            </ul>
        </div>
        <p>Copyright&copy;WarmSIP</p>
    </footer>
    <!--ending of footer codes-->

</body>

</html>
