<body>
    <!-- starting of the header codes -->
    <header>
        <nav>
            <div class="header_elements">
                <a href="index.html">
                    <h3 class="logo">WarmSIP</h3>
                </a>
                <div class="header_rightSide">
                    <ul>
                        <li><a href="index.html">Home</a></li>

                        <li><a href="services.html">Services</a></li>
                        <li><a href="contact_us.html">Contact Us</a></li>

                    <a href="basket.html"><img src="Assets/images/emptyBasket.png" width="75" alt="basket_icon"
                            class="basket_icon" id="basket_icon"></a>
                </div>
            </div>
        </nav>
    </header>
    <!-- ending of the header codes -->

    <!-- starting of main codes -->
    <main>

        <!-- starting of the title and items part  -->
        <h1>Your Basket</h1>
        <hr class="breaker">
        <section class="cards" style="margin-bottom: 70px;" id="cards"></section>

        <!-- ending of the title and items part  -->
        <hr class="breaker">

        <!-- reservation info, date, time and comments -->
        <form class="reservation_info" id="reservation_info">
            
        </form>
        <!-- reservation info, date, time and comments -->



        <!-- starting of payment infos and total price  -->
        <section id="the_price">
            <div class="items">
                <p class="discribe">Subtotal:</p>
                <p class="value" id="subtotal">0</p>
            </div>
            <hr>
            <div class="items">
                <p class="discribe">Tax (5%):</p>
                <p class="value" id="tax">0</p>
            </div>
            <hr>
            <div class="items">
                <p class="discribe">Total:</p>
                <p class="value" id="total">0</p>
            </div>
        </section>

        <!-- ending of payment infos and total price  -->



        <!-- starting pay button  -->
        <button type="submit" form="reservation_info" onclick='check_phone(); check_content(); saveOrderForm(); check_basket()'>Reserve Now</button>
        <!-- ending pay button  -->
         <span id="announ" style="color:brown; justify-content: center; display: flex; font-size: 20px; margin-bottom: 40px;margin-top: -50px; font-family: Arial, Helvetica, sans-serif;"></span>

    </main>
